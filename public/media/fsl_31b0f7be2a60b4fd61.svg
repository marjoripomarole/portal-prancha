<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fb"/><text x="36" y="42" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="27">Aplicar e interpretar medidas</text><rect x="30" y="70" width="460" height="104" rx="12" fill="white" stroke="#c7d8e2" stroke-width="2"/><text x="260.0" y="129.04" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size="22">50 por 100.000 no período</text><rect x="31" y="71" width="458" height="32" rx="10" fill="#e5eef4"/><text x="42" y="93" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="17">25 casos novos / 50.000 sob risco</text><rect x="520" y="70" width="460" height="104" rx="12" fill="white" stroke="#c7d8e2" stroke-width="2"/><text x="750.0" y="129.04" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size="22">Letalidade de 25%</text><rect x="521" y="71" width="458" height="32" rx="10" fill="#e5eef4"/><text x="532" y="93" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="17">50 óbitos entre 200 casos</text><rect x="30" y="190" width="460" height="104" rx="12" fill="white" stroke="#c7d8e2" stroke-width="2"/><text x="260.0" y="249.04" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size="22">5 por 1.000 nascidos vivos</text><rect x="31" y="191" width="458" height="32" rx="10" fill="#e5eef4"/><text x="42" y="213" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="17">10 óbitos infantis / 2.000 nascidos vivos</text><rect x="520" y="190" width="460" height="104" rx="12" fill="white" stroke="#c7d8e2" stroke-width="2"/><text x="750.0" y="249.04" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size="22">Aumentar prevalência</text><rect x="521" y="191" width="458" height="32" rx="10" fill="#e5eef4"/><text x="532" y="213" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="17">Sobrevida maior sem cura tende a</text><rect x="30" y="310" width="460" height="104" rx="12" fill="white" stroke="#c7d8e2" stroke-width="2"/><text x="260.0" y="369.04" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size="22">Sim</text><rect x="31" y="311" width="458" height="32" rx="10" fill="#e5eef4"/><text x="42" y="333" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="17">Alta letalidade pode reduzir prevalência?</text><rect x="520" y="310" width="460" height="104" rx="12" fill="white" stroke="#c7d8e2" stroke-width="2"/><text x="750.0" y="369.04" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size="22">Aproximação em condições estáveis</text><rect x="521" y="311" width="458" height="32" rx="10" fill="#e5eef4"/><text x="532" y="333" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="17">Prevalência ≈ incidência × duração</text><rect x="30" y="430" width="460" height="104" rx="12" fill="white" stroke="#c7d8e2" stroke-width="2"/><text x="260.0" y="489.04" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size="22">Não permite comparar risco sozinho</text><rect x="31" y="431" width="458" height="32" rx="10" fill="#e5eef4"/><text x="42" y="453" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="17">Mesmo número de óbitos em cidades diferentes</text><rect x="520" y="430" width="460" height="104" rx="12" fill="white" stroke="#c7d8e2" stroke-width="2"/><text x="750.0" y="476.28000000000003" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size="22">Comparar populações com estruturas</text><text x="750.0" y="502.02000000000004" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size