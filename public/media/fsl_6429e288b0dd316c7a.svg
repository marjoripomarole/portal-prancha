<svg xmlns="http://www.w3.org/2000/svg" width="760" height="514" viewBox="0 0 760 514"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087f8c"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fb"/><text x="25" y="32" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="25">Obstrução de via aérea por corpo estranho</text><rect x="20" y="88" width="720" height="124" rx="12" fill="white" stroke="#c7d8e2" stroke-width="2"/><text x="380.0" y="156.72" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size="21"></text><text x="37" y="114" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="21">Vítima com obstrução fica inconsciente</text><text x="37" y="158" text-anchor="start" fill="#087f8c" font-family="Arial, sans-serif" font-size="23">Iniciar RCP pelas compressões</text><rect x="20" y="226" width="720" height="124" rx="12" fill="white" stroke="#c7d8e2" stroke-width="2"/><text x="380.0" y="294.72" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size="21"></text><text x="37" y="252" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="21">Ao abrir via aérea durante RCP por obstrução</text><text x="37" y="296" text-anchor="start" fill="#087f8c" font-family="Arial, sans-serif" font-size="23">Remover somente objeto visível</text><rect x="20" y="364" width="720" height="124" rx="12" fill="white" stroke="#c7d8e2" stroke-width="2"/><text x="380.0" y="432.72" text-anchor="middle" fill="#173047" font-family="Arial, sans-serif" font-size="21"></text><text x="37" y="390" text-anchor="start" fill="#173047" font-family="Arial, sans-serif" font-size="21">Cianose e incapacidade de falar/tossir eficazmente</text><text x="37" y="434" text-anchor="start" fill="#087f8c" font-family="Arial, sans-serif" font-size="23">Sugerem obstrução grave</text></svg>